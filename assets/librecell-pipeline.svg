<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 430" role="img" aria-labelledby="title desc">
  <title id="title">LibreCell本地实现的数据流</title>
  <desc id="desc">SPICE与tech进入解析，经过布局、几何生成、布线、后处理、内部LVS和写出。</desc>
  <style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.box{fill:#eef3ff;stroke:#2457d6;stroke-width:3}.verify{fill:#e8f7ef;stroke:#147a4b;stroke-width:3}.out{fill:#fff5df;stroke:#9a5b00;stroke-width:3}.label{font-size:18px;font-weight:700}.small{font-size:15px}.arrow{stroke:#667085;stroke-width:3;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#667085"/></marker></defs>
  <rect width="1260" height="430" fill="#fff"/><text x="630" y="42" text-anchor="middle" class="title">本地 LibreCell：以 standalone.py 的真实调用顺序为准</text>
  <rect x="35" y="105" width="145" height="80" rx="10" class="out"/><text x="108" y="137" text-anchor="middle" class="label">SPICE</text><text x="108" y="164" text-anchor="middle" class="small">晶体管与引脚</text>
  <rect x="35" y="235" width="145" height="80" rx="10" class="out"/><text x="108" y="267" text-anchor="middle" class="label">Tech Python</text><text x="108" y="294" text-anchor="middle" class="small">层、尺寸、规则</text>
  <rect x="235" y="170" width="145" height="80" rx="10" class="box"/><text x="307" y="202" text-anchor="middle" class="label">加载/归一化</text><text x="307" y="229" text-anchor="middle" class="small">W换算为dbu</text>
  <rect x="430" y="170" width="145" height="80" rx="10" class="box"/><text x="502" y="202" text-anchor="middle" class="label">晶体管布局</text><text x="502" y="229" text-anchor="middle" class="small">Cell双行模型</text>
  <rect x="625" y="170" width="145" height="80" rx="10" class="box"/><text x="697" y="202" text-anchor="middle" class="label">绘制初始几何</text><text x="697" y="229" text-anchor="middle" class="small">MOS/阱/电源轨</text>
  <rect x="820" y="170" width="145" height="80" rx="10" class="box"/><text x="892" y="202" text-anchor="middle" class="label">构图与布线</text><text x="892" y="229" text-anchor="middle" class="small">PathFinder + HV</text>
  <rect x="1015" y="105" width="180" height="80" rx="10" class="box"/><text x="1105" y="137" text-anchor="middle" class="label">后处理</text><text x="1105" y="164" text-anchor="middle" class="small">notch + min-area</text>
  <rect x="1015" y="235" width="180" height="80" rx="10" class="verify"/><text x="1105" y="267" text-anchor="middle" class="label">内部3端LVS</text><text x="1105" y="294" text-anchor="middle" class="small">不是foundry sign-off</text>
  <rect x="1015" y="345" width="180" height="58" rx="10" class="out"/><text x="1105" y="380" text-anchor="middle" class="label">GDS / LEF / MAG</text>
  <line x1="180" y1="145" x2="235" y2="195" class="arrow"/><line x1="180" y1="275" x2="235" y2="225" class="arrow"/>
  <line x1="380" y1="210" x2="430" y2="210" class="arrow"/><line x1="575" y1="210" x2="625" y2="210" class="arrow"/><line x1="770" y1="210" x2="820" y2="210" class="arrow"/>
  <line x1="965" y1="195" x2="1015" y2="160" class="arrow"/><line x1="1105" y1="185" x2="1105" y2="235" class="arrow"/><line x1="1105" y1="315" x2="1105" y2="345" class="arrow"/>
  <text x="630" y="90" text-anchor="middle" class="small">代码中没有一个独立的“river detailed router”阶段；图路径会直接转换为实际几何。</text>
</svg>
