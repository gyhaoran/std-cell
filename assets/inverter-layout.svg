<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 700" role="img" aria-labelledby="title desc">
  <title id="title">CMOS反相器从版图识别电路</title>
  <desc id="desc">上方PMOS、下方NMOS，共用输入栅A，右侧扩散通过金属连接为输出Y。</desc>
  <style>
    text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:700}.small{font-size:17px}.net{font-size:21px;font-weight:700}.wire{fill:#e6a23c;stroke:#925500;stroke-width:3}.activep{fill:#f5a6c8;stroke:#8d2b5c;stroke-width:3}.activen{fill:#91caff;stroke:#1255a6;stroke-width:3}.poly{fill:#e762a5;stroke:#7d2455;stroke-width:3}.contact{fill:#6f4d9b;stroke:#42235f;stroke-width:3}.dash{stroke:#667085;stroke-width:2;stroke-dasharray:8 7}
  </style>
  <rect width="1120" height="700" fill="#fff"/>
  <text x="560" y="42" text-anchor="middle" class="title">反相器：先找 Active × Poly，再沿接触孔与金属追网</text>
  <rect x="80" y="70" width="720" height="570" rx="12" fill="#f8fafc" stroke="#98a2b3" stroke-width="3"/>
  <rect x="100" y="88" width="680" height="70" class="wire"/><text x="440" y="132" text-anchor="middle" class="net">VDD 电源轨</text>
  <rect x="100" y="552" width="680" height="70" class="wire"/><text x="440" y="596" text-anchor="middle" class="net">VSS / GND 电源轨</text>
  <rect x="155" y="187" width="470" height="120" rx="8" fill="#dcecff" stroke="#2457d6" stroke-width="3" opacity=".75"/>
  <text x="665" y="218" class="small">N-Well</text>
  <rect x="185" y="214" width="380" height="70" rx="5" class="activep"/><text x="375" y="205" text-anchor="middle" class="small">P-diffusion / Active</text>
  <rect x="185" y="408" width="380" height="70" rx="5" class="activen"/><text x="375" y="500" text-anchor="middle" class="small">N-diffusion / Active</text>
  <rect x="345" y="180" width="55" height="335" rx="3" class="poly"/><text x="372" y="535" text-anchor="middle" class="net">A</text>
  <rect x="215" y="229" width="38" height="38" class="contact"/><rect x="500" y="229" width="38" height="38" class="contact"/>
  <rect x="215" y="424" width="38" height="38" class="contact"/><rect x="500" y="424" width="38" height="38" class="contact"/>
  <rect x="215" y="145" width="38" height="90" class="wire"/><rect x="215" y="455" width="38" height="104" class="wire"/>
  <rect x="500" y="245" width="38" height="197" class="wire"/><rect x="500" y="318" width="200" height="55" class="wire"/>
  <text x="715" y="353" class="net" fill="#7a3ee6">Y</text>
  <text x="280" y="260" text-anchor="middle" class="small">S</text><text x="455" y="260" text-anchor="middle" class="small">D</text>
  <text x="280" y="455" text-anchor="middle" class="small">S</text><text x="455" y="455" text-anchor="middle" class="small">D</text>
  <rect x="850" y="110" width="210" height="480" rx="12" fill="#fff" stroke="#d0d5dd" stroke-width="3"/>
  <text x="955" y="155" text-anchor="middle" class="label">读图顺序</text>
  <circle cx="890" cy="205" r="20" fill="#2457d6"/><text x="890" y="212" text-anchor="middle" fill="#fff" class="label">1</text><text x="925" y="212" class="small">找阱与上下排</text>
  <circle cx="890" cy="275" r="20" fill="#2457d6"/><text x="890" y="282" text-anchor="middle" fill="#fff" class="label">2</text><text x="925" y="282" class="small">找交叠得MOS</text>
  <circle cx="890" cy="345" r="20" fill="#2457d6"/><text x="890" y="352" text-anchor="middle" fill="#fff" class="label">3</text><text x="925" y="352" class="small">Poly相连得A</text>
  <circle cx="890" cy="415" r="20" fill="#2457d6"/><text x="890" y="422" text-anchor="middle" fill="#fff" class="label">4</text><text x="925" y="422" class="small">追扩散与金属</text>
  <circle cx="890" cy="485" r="20" fill="#2457d6"/><text x="890" y="492" text-anchor="middle" fill="#fff" class="label">5</text><text x="925" y="492" class="small">写出S/G/D网</text>
  <text x="955" y="555" text-anchor="middle" class="small">得到 1 PMOS + 1 NMOS</text>
  <line x1="400" y1="225" x2="400" y2="475" class="dash"/>
  <text x="90" y="675" class="small">注意：源/漏的物理左右方向可交换；先按网络连通性判断，不要靠“左边一定是源极”死记。</text>
</svg>
