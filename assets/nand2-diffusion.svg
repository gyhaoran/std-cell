<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">NAND2晶体管网络与扩散连续性</title>
  <desc id="desc">PMOS并联可采用Y-VDD-Y扩散序列，NMOS串联采用Y-X-VSS序列。</desc>
  <style>text{font-family:Arial,"Noto Sans SC",sans-serif;fill:#172033}.title{font-size:25px;font-weight:700}.label{font-size:20px;font-weight:700}.small{font-size:17px}.p{fill:#f5a6c8;stroke:#8d2b5c;stroke-width:3}.n{fill:#91caff;stroke:#1255a6;stroke-width:3}.g{fill:#e762a5;stroke:#7d2455;stroke-width:3}.node{font-size:19px;font-weight:700}.arrow{stroke:#667085;stroke-width:3;marker-end:url(#arrow)}</style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L8,3 z" fill="#667085"/></marker></defs>
  <rect width="1120" height="650" fill="#fff"/><text x="560" y="42" text-anchor="middle" class="title">NAND2：连续 Active 不等于所有区域同一网络，Poly 会把它分成 S/D 区</text>
  <text x="80" y="92" class="label">PMOS行：并联网络</text><text x="80" y="350" class="label">NMOS行：串联网络</text>
  <rect x="90" y="125" width="700" height="105" rx="9" class="p"/><rect x="306" y="105" width="55" height="145" class="g"/><rect x="520" y="105" width="55" height="145" class="g"/>
  <text x="333" y="96" text-anchor="middle" class="node">A</text><text x="547" y="96" text-anchor="middle" class="node">B</text>
  <text x="198" y="185" text-anchor="middle" class="node">Y</text><text x="440" y="185" text-anchor="middle" class="node">VDD</text><text x="682" y="185" text-anchor="middle" class="node">Y</text>
  <text x="830" y="145" class="small">两只PMOS都连接 VDD↔Y</text><text x="830" y="180" class="small">所以它们电气上并联</text><text x="830" y="215" class="small">无需“用Contact切断扩散”</text>
  <rect x="90" y="385" width="700" height="105" rx="9" class="n"/><rect x="306" y="365" width="55" height="145" class="g"/><rect x="520" y="365" width="55" height="145" class="g"/>
  <text x="333" y="356" text-anchor="middle" class="node">A</text><text x="547" y="356" text-anchor="middle" class="node">B</text>
  <text x="198" y="445" text-anchor="middle" class="node">Y</text><text x="440" y="445" text-anchor="middle" class="node">X</text><text x="682" y="445" text-anchor="middle" class="node">VSS</text>
  <text x="830" y="405" class="small">只有中间扩散 X 被共享</text><text x="830" y="440" class="small">电流路径 Y→X→VSS</text><text x="830" y="475" class="small">所以两只NMOS串联</text>
  <line x1="170" y1="285" x2="710" y2="285" class="arrow"/><text x="440" y="318" text-anchor="middle" class="small">从左到右读“扩散网络—栅—扩散网络—栅—扩散网络”</text>
  <rect x="80" y="545" width="960" height="70" rx="10" fill="#fff5df" stroke="#9a5b00" stroke-width="3"/>
  <text x="560" y="575" text-anchor="middle" class="small">判断能否无缝相邻的唯一条件：左晶体管右侧网络 == 右晶体管左侧网络。</text>
  <text x="560" y="603" text-anchor="middle" class="small">这正是欧拉路径把“网络当顶点、晶体管当边”的原因。</text>
</svg>
