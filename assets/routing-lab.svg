<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="t d"><title id="t">两根网络从独立最短路到消除冲突</title><desc id="d">左边 A 沿第一行和绕开障碍的 B 共用三个节点。右边 A 绕到第二行，多走两步而不再共用节点。</desc><rect width="1100" height="560" fill="white"/>
