<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
<title id="title">平面 bulk CMOS 剖面：栅氧、源漏与体接触</title>
<desc id="desc">左为 N 阱中 PMOS，右为 P 型衬底中 NMOS。栅氧隔开栅与沟道，接触孔连接源漏到独立金属，STI 隔开有源区。示意图不按比例。</desc>
<rect width="1200" height="600" fill="#fff"/>
<g font-family="sans-serif" font-size="18" fill="#172033">
<text x="36" y="36" font-size="25" font-weight="bold">平面 CMOS 剖面（非比例；不是 FreePDK45 制造截面）</text>
<rect x="40" y="295" width="1120" height="205" fill="#dceafa" stroke="#356397" stroke-width="2"/>
<rect x="60" y="295" width="520" height="175" rx="18" fill="#ffe2dd" stroke="#bc6254" stroke-width="2"/>
<text x="215" y="444">N-well：PMOS 的 B 端</text><text x="742" y="455">P 型衬底：NMOS 的 B 端</text>
<text x="180" y="85" font-size="23">PMOS</text><text x="773" y="85" font-size="23">NMOS</text>
<g fill="#e48888" stroke="#a34444" stroke-width="2"><rect x="220" y="295" width="100" height="53" rx="8"/><rect x="385" y="295" width="100" height="53" rx="8"/></g>
<g fill="#92b9e3" stroke="#356397" stroke-width="2"><rect x="755" y="295" width="100" height="53" rx="8"/><rect x="920" y="295" width="100" height="53" rx="8"/><rect x="95" y="295" width="65" height="53" rx="8"/></g>
<rect x="1070" y="295" width="65" height="53" rx="8" fill="#e48888" stroke="#a34444" stroke-width="2"/>
<g fill="#e5e7eb" stroke="#667085"><rect x="177" y="295" width="25" height="75"/><rect x="600" y="295" width="95" height="90"/><rect x="1036" y="295" width="20" height="75"/></g>
<text x="621" y="335">STI</text><text x="95" y="379">n+ tap</text><text x="1062" y="379">p+ tap</text>
<text x="258" y="328">p+</text><text x="420" y="328">p+</text><text x="787" y="328">n+</text><text x="953" y="328">n+</text>
<g fill="#70cdb7" stroke="#19765d" stroke-width="2"><rect x="320" y="286" width="65" height="9"/><rect x="855" y="286" width="65" height="9"/></g>
<g fill="#baa5df" stroke="#64458c" stroke-width="2"><rect x="320" y="236" width="65" height="50"/><rect x="855" y="236" width="65" height="50"/></g>
<g fill="#6b7280"><rect x="120" y="190" width="15" height="105"/><rect x="260" y="190" width="15" height="105"/><rect x="428" y="190" width="15" height="105"/><rect x="795" y="190" width="15" height="105"/><rect x="963" y="190" width="15" height="105"/><rect x="1095" y="190" width="15" height="105"/></g>
<g fill="#f4d481" stroke="#9a7425" stroke-width="2"><rect x="88" y="169" width="78" height="22"/><rect x="225" y="169" width="80" height="22"/><rect x="400" y="169" width="80" height="22"/><rect x="760" y="169" width="80" height="22"/><rect x="935" y="169" width="80" height="22"/><rect x="1066" y="169" width="78" height="22"/></g>
<text x="94" y="153">B→VDD</text><text x="225" y="153">S→VDD</text><text x="417" y="153">D→Y</text><text x="760" y="153">S→VSS</text><text x="950" y="153">D→Y</text><text x="1060" y="153">B→VSS</text>
<text x="335" y="226">G</text><text x="870" y="226">G</text>
<path d="M325 298 H380 M860 298 H915" stroke="#256c54" stroke-width="4"/>
<text x="254" y="405">沟道在栅下，受栅电压控制</text><path d="M350 385 V309" fill="none" stroke="#475467"/>
<text x="527" y="228">薄栅氧</text><path d="M530 235 L384 290" fill="none" stroke="#19765d"/>
<text x="520" y="267">硅表面 ↓</text><path d="M535 275 V295" stroke="#475467"/>
<text x="52" y="532">灰色：接触孔　 黄色：彼此独立的 M1 段　 紫色：栅　 绿色薄层：栅氧</text>
<text x="52" y="562">两段 Y 可在剖面外相连；G 的引线也可在剖面外。此图不代表完整布线，不能把源漏直接短接。</text>
<text x="52" y="589">STI = 浅沟槽隔离；tap 是体接触，不是受栅控制的逻辑晶体管。</text>
</g></svg>
